"$schema" = 'https://starship.rs/config-schema.json'

# ─────────────────────────────────────────────────────────────
#  Geeky powerline prompt
# ─────────────────────────────────────────────────────────────

format = """
[](color_os)\
$os\
$username\
[](bg:color_host fg:color_os)\
$hostname\
[](bg:color_dir fg:color_host)\
$directory\
[](bg:color_git fg:color_dir)\
$git_branch\
$git_status\
[](bg:color_lang fg:color_git)\
$nodejs\
$python\
$rust\
$golang\
$java\
$ruby\
$php\
$c\
$docker_context\
[](bg:color_time fg:color_lang)\
$cmd_duration\
$time\
[](fg:color_time)\
$line_break\
$character"""

add_newline = true

palette = "geek"

[palettes.geek]
color_os   = "#1a1b26"
color_host = "#7aa2f7"
color_dir  = "#bb9af7"
color_git  = "#9ece6a"
color_lang = "#e0af68"
color_time = "#414868"
text_dark  = "#1a1b26"
text_light = "#c0caf5"

# ─────────────────────────────────────────────────────────────
#  Modules
# ─────────────────────────────────────────────────────────────

[os]
disabled = false
style = "bg:color_os fg:text_light"
format = "[ $symbol ]($style)"

[username]
show_always = true
style_user = "bg:color_os fg:text_light"
style_root = "bg:color_os fg:#f7768e"
format = "[$user ]($style)"

[hostname]
ssh_only = false
ssh_symbol = " "
style = "bg:color_host fg:text_dark"
format = "[ $ssh_symbol$hostname ]($style)"

[directory]
style = "bg:color_dir fg:text_dark"
format = "[ $path ]($style)"
truncation_length = 4
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "bg:color_dir fg:#f7768e"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = " "
style = "bg:color_git fg:text_dark"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:color_git fg:text_dark"
format = "[$all_status$ahead_behind ]($style)"
conflicted = "⚔️ "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = " "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[nodejs]
symbol = " "
style = "bg:color_lang fg:text_dark"
format = "[ $symbol($version) ]($style)"

[python]
symbol = " "
style = "bg:color_lang fg:text_dark"
format = "[ $symbol($version) ]($style)"

[rust]
symbol = "󱘗 "
style = "bg:color_lang fg:text_dark"
format = "[ $symbol($version) ]($style)"

[golang]
symbol = " "
style = "bg:color_lang fg:text_dark"
format = "[ $symbol($version) ]($style)"

[java]
symbol = " "
style = "bg:color_lang fg:text_dark"
format = "[ $symbol($version) ]($style)"

[ruby]
symbol = " "
style = "bg:color_lang fg:text_dark"
format = "[ $symbol($version) ]($style)"

[php]
symbol = " "
style = "bg:color_lang fg:text_dark"
format = "[ $symbol($version) ]($style)"

[c]
symbol = " "
style = "bg:color_lang fg:text_dark"
format = "[ $symbol($version) ]($style)"

[docker_context]
symbol = " "
style = "bg:color_lang fg:text_dark"
format = "[ $symbol$context ]($style)"

[cmd_duration]
min_time = 500
style = "bg:color_time fg:text_light"
format = "[ 󱎫 $duration ]($style)"

[time]
disabled = false
time_format = "%R"
style = "bg:color_time fg:text_light"
format = "[  $time ]($style)"

[character]
success_symbol = "[❯](bold #9ece6a)"
error_symbol = "[❯](bold #f7768e)"
vimcmd_symbol = "[❮](bold #e0af68)"

